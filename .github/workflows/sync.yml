name: qx-sync

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: qx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 扫描 + 镜像 + 生成配置
        run: python scripts/sync.py

      - name: 提交变更
        run: |
          git config user.name  'qx-sync-bot'
          git config user.email 'qx-sync-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
            exit 0
          fi
          SUMMARY=$(python -c "import json;d=json.load(open('reports/status.json'))['summary'];print(f\"可用 {d['alive']}/{d['total']}，失效 {d['dead']}，修复 {d['replaced']}，新增失效 {d['newly_dead']}\")")
          git commit -m "chore: sync $(date -u '+%Y-%m-%d %H:%M UTC') — $SUMMARY"
          git push
